name: 'Install for a lower PHP'
description: 'Install Composer dependencies for a PHP version older than the code targets, downgrading only what has no compatible version.'
author: 'php-internal'

branding:
  icon: 'download'
  color: 'purple'

inputs:
  php-version:
    description: 'Target PHP version to install and downgrade for (one of 8.0, 8.1, 8.2, 8.3, 8.4).'
    required: true
  paths:
    description: 'Space-separated project sources to also downgrade, relative to the working directory. Incompatible dependencies are downgraded automatically; use this only for the project''s own code when it targets a newer PHP.'
    required: false
    default: ''
  dependency-versions:
    description: "Which dependency versions to resolve: 'lowest' or 'highest'."
    required: false
    default: 'highest'
  skip:
    description: 'Space-separated paths or glob patterns to skip during the Rector downgrade.'
    required: false
    default: ''
  rector-version:
    description: 'Composer version constraint for the throwaway rector/rector install.'
    required: false
    default: '^2.6'
  working-directory:
    description: 'Project root. Defaults to the workspace.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: 'Install and downgrade for PHP ${{ inputs.php-version }}'
      shell: bash
      env:
        INPUT_PHP_VERSION: ${{ inputs.php-version }}
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_DEPENDENCY_VERSIONS: ${{ inputs.dependency-versions }}
        INPUT_SKIP: ${{ inputs.skip }}
        INPUT_RECTOR_VERSION: ${{ inputs.rector-version }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: bash "$GITHUB_ACTION_PATH/install.sh"
